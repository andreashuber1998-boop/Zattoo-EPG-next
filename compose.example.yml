services:
  zattoo-epg:
    build: .
    container_name: zattoo-epg
    environment:
      ZATTOO_EMAIL: ${ZATTOO_EMAIL:?Set ZATTOO_EMAIL in .env}
      ZATTOO_PASSWORD: ${ZATTOO_PASSWORD:?Set ZATTOO_PASSWORD in .env}
      COUNTRY: CH
      DAYS: "7"
      CHANNEL_FILTER_FILE: /config/channels.txt
      CACHE_TTL_DAYS: "30"
      UPDATE_INTERVAL_SECONDS: "43200"
      REPLAY_ENABLED: "true"
      REPLAY_PORT: "8090"
      TELERISING_BASE_URL: ${TELERISING_BASE_URL:?Set TELERISING_BASE_URL in .env}
    volumes:
      - ./data:/data
      - ./output:/output
      - ./channels.txt:/config/channels.txt:ro
    ports:
      - "8080:8080"
      - "8090:8090"
    restart: unless-stopped
